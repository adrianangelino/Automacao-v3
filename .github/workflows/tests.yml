name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npx jest

      - name: Build
        run: npm run build

      - name: Painel (lint + build)
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run build
